version: "3.8"

services:
  turn-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turn-orchestrator-engine
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
    restart: unless-stopped
    networks:
      - turn-orchestrator-net

  prometheus:
    image: prom/prometheus:latest
    container_name: turn-orchestrator-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - turn-orchestrator-net
    depends_on:
      - turn-orchestrator

networks:
  turn-orchestrator-net:
    driver: bridge
