version: "3.8"

services:
  vocalflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocalflow-engine
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
    restart: unless-stopped
    networks:
      - vocalflow-net

  prometheus:
    image: prom/prometheus:latest
    container_name: vocalflow-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - vocalflow-net
    depends_on:
      - vocalflow

networks:
  vocalflow-net:
    driver: bridge
