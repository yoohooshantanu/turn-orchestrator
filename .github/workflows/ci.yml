name: TurnOrchestrator CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Unit & Integration Tests
        run: go test -v -race ./tests/...

      - name: Build Server Binary
        run: go build -v -o bin/turn-orchestrator ./cmd/server
